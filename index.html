<style>

/* ===== Animaciones fusionadas (muelles, ondas, cascada) ===== */

@keyframes onda{to{transform:scale(1);opacity:0}}@keyframes agita{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}@keyframes late{50%{transform:scale(1.3) rotate(-8deg)}}
#app.in{animation:entra .4s var(--suave)}
#spider{overflow:visible}#spider svg{animation:flota 2.6s ease-in-out infinite}.eye{animation:pulso 2.4s ease-in-out infinite}

.btn,.opts button,.chips button,nav button{position:relative;overflow:hidden;transition:transform .25s var(--muelle),border-color .2s,background .2s,color .2s}
.btn:hover,.opts button:hover:not(:disabled){transform:translateY(-2px)}.btn:active,.opts button:active:not(:disabled),.chips button:active{transform:scale(.96)}
.opts button{animation:sube .35s var(--suave) backwards;animation-delay:calc(var(--i,0)*60ms)}
.onda{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);pointer-events:none;animation:onda .6s ease-out forwards}
#gear svg{transition:transform .6s var(--muelle)}#gear:hover svg{transform:rotate(120deg)}#gear.abre svg{transform:rotate(180deg)}
#menu:not([hidden]){animation:pop .25s var(--muelle);transform-origin:top right}
.st{animation:pop .45s var(--muelle) backwards;animation-delay:calc(var(--i,0)*100ms);transform-box:fill-box;transform-origin:center}.sch .st rect{fill:var(--pn)}

.opts button.ok{background:#16a34a;border-color:#16a34a;color:#fff}.opts button.mal{background:#dc2626;border-color:#dc2626;color:#fff;animation:agita .4s}.opts button.ok:disabled,.opts button.mal:disabled{opacity:1}

/* ===== Progreso, laboratorio y fondo (v2) ===== */

/* ===== Diseño HPextras (v2.1): se agrega, no se quita nada ===== */
.card{border-radius:16px}.btn,.opts button{border-radius:12px}
.brand{display:flex;align-items:center;gap:10px}.brand small{display:block;line-height:1.1}

@keyframes hptr{to{stroke-dashoffset:-132}}

/* ===== Ajuste automático (v2.2): celular, tableta y computadora ===== */
input,select,textarea{font-size:max(16px,1em)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
main,.top,nav{max-width:1100px;margin-inline:auto}

/* Contraste: acento claro para texto y acento oscuro para botones rellenos */

main{padding-bottom:96px}

let PRESET='',LABSEL='',LEARNSEL='',QUIZPRE='',GAMESEL='',WIKISEC='',HAP=true;try{HAP=localStorage.getItem('ac-hap')!='0'}catch(e){}
const toast=m=>{const x=$('#toast');x.textContent=m;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),2200)};
const vib=p=>{try{HAP&&navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const ST0={xp:0,ok:0,n:0,best:0,days:{},by:{},les:{},labs:{},dxs:{},fail:{},rep:0};
let PR={...ST0};try{PR={...ST0,...JSON.parse(localStorage.getItem('ac-pr'))}}catch(e){}
const saveP=()=>{try{localStorage.setItem('ac-pr',JSON.stringify(PR))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const dstr=()=>{let n=0,d=new Date();while(PR.days[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n};
const LVL=()=>Math.floor(Math.sqrt(PR.xp/20))+1;
const gain=(n,m)=>{const a=LVL(),d=ymd(new Date());PR.xp+=n;if(PR.td!==d){PR.td=d;PR.tx=0}PR.tx+=n;PR.days[d]=1;saveP();const up=LVL()>a;toast(up?`¡Nivel ${LVL()}! +${n} XP`:`+${n} XP${m?' · '+m:''}`);if(up)burst()};
const rec=(tp,ok,id)=>{PR.n++;if(ok)PR.ok++;const b=PR.by[tp]||[0,0];b[1]++;if(ok)b[0]++;PR.by[tp]=b;if(id){if(ok){delete PR.fail[id];(PR.qd=PR.qd||{})[id]=1}else PR.fail[id]=1}PR.days[ymd(new Date())]=1;saveP()};
const seeDx=k=>{if(!PR.dxs[k]){PR.dxs[k]=1;gain(3,'Diagnóstico completado')}};
const STAR='<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>';
const BD=[['Primer acierto',()=>PR.ok>=1],['Racha de 5',()=>PR.best>=5],['Racha de 10',()=>PR.best>=10],['25 aciertos',()=>PR.ok>=25],['Nivel 3',()=>LVL()>=3],['Nivel 5',()=>LVL()>=5],['Estudiante',()=>Object.keys(PR.les).length>=1],['Graduado',()=>Object.keys(PR.les).length>=LESS.length],['Detective',()=>Object.keys(PR.dxs).length>=5],['Explorador',()=>Object.keys(PR.labs).length>=3],['Repasador',()=>PR.rep>=1],['3 días seguidos',()=>dstr()>=3]];
const TOP={ohm:'Ohm y potencia',comp:'Componentes',herr:'Herramientas y seguridad',semi:'Transistores y CI',casos:'Casos reales',calc:'Cálculos al vuelo',dig:'Electrónica digital',aud:'Audio y señales',juego:'Juegos'};
function progCard(){const L=LVL(),a=PR.xp-20*(L-1)**2,b=20*L*L-20*(L-1)**2,pc=PR.n?Math.round(PR.ok/PR.n*100):0,ok=BD.filter(x=>x[1]()).length;
 return `<div class="card"><h3>Tu progreso</h3><div class="row" style="grid-template-columns:repeat(4,1fr)"><div><small>Nivel</small><div class="big">${L}</div></div><div><small>Precisión</small><div class="big">${pc}%</div></div><div><small>Aciertos</small><div class="big">${PR.ok}/${PR.n}</div></div><div><small>Racha de días</small><div class="big">${dstr()}</div></div></div><div class="bar"><i style="width:${Math.min(100,a/b*100)}%"></i></div><small>${a} / ${b} XP para el nivel ${L+1} · mejor racha de aciertos: ${PR.best}</small></div><div class="card"><h3>Dominio por tema</h3>${Object.entries(TOP).map(([k,n])=>{const[x,y]=PR.by[k]||[0,0];return `<div style="margin:8px 0"><small>${n} · ${x} de ${y}</small><div class="bar"><i style="width:${y?x/y*100:0}%"></i></div></div>`}).join('')}</div><div class="card"><h3>Logros <small>${ok}/${BD.length}</small></h3><div class="bds">${BD.map(x=>`<div class="bdg${x[1]()?' on':''}">${svg(STAR)}${x[0]}</div>`).join('')}</div></div>`}

const NEW={"COMP":[["Diodo Zener 1N4733A (5.1 V)",1,"S","axial","1N4733A","diodo zener 1N4733A 5.1V 1W","Diodo que, polarizado en inverso, conduce justo al llegar a su voltaje Zener y lo mantiene casi constante.","Referencias de voltaje, protección contra picos y reguladores pequeños con un resistor en serie.","5.1 V y 1 W: corriente máxima cercana a 195 mA.","En modo diodo conduce en directo (≈ 0.7 V) y marca OL en inverso.","Conectarlo sin resistor en serie: la corriente se dispara y se quema."],["Diodo Schottky 1N5819",1,"S","axial","1N5819","diodo schottky 1N5819 1A","Diodo con caída de solo 0.2 a 0.4 V y conmutación muy rápida, a cambio de más fuga en inverso.","Convertidores buck y boost, protección contra polaridad con poca pérdida.","1 A y 40 V; caída cercana a 0.3 V.","En modo diodo marca entre 0.15 y 0.3 V en directo.","Usarlo con más de 40 V inversos: se perfora."],["Puente rectificador W10M",1,"S","bridge","W10M","puente rectificador W10M 1A","Cuatro diodos en una sola pieza que convierten CA en CC pulsante aprovechando toda la onda.","Fuentes de poder, cargadores y eliminadores.","1 A y 1000 V inversos.","Mide cada par de patas en modo diodo: debe conducir en un sentido y no en el otro.","Conectar las terminales de CA (~) donde van las de CC (+ y −)."],["Transistor PNP 2N3906",1,"S","to92","2N3906","transistor 2N3906 PNP TO-92","Como el NPN, pero conduce cuando la base se lleva a un voltaje menor que el emisor: se usa del lado positivo de la carga.","Interruptores del lado alto, etapas complementarias de audio y espejos de corriente.","Hasta 200 mA y 40 V.","Con la punta roja en el emisor y la negra en la base, marca cerca de 0.65 V.","Confundirlo con el 2N3904 (NPN): lee la leyenda de la pieza."],["Transistor Darlington TIP120",2,"S","to220","TIP120","transistor TIP120 darlington TO-220","Dos transistores en uno con ganancia enorme (más de 1000): una señal mínima del microcontrolador maneja cargas grandes.","Motores, solenoides, tiras LED y relevadores grandes.","5 A y 60 V; cae cerca de 1.2 V y se calienta.","Entre base y emisor, en modo diodo, marca cerca de 1.2 V por ser dos uniones.","Olvidar el diodo flyback con cargas inductivas y no ponerle disipador."],["Triac BT136",2,"S","to220","BT136","triac BT136 600V 4A","Interruptor de estado sólido para CA: un pulso en la compuerta lo enciende y se apaga solo al cruzar por cero.","Reguladores de velocidad, atenuadores (dimmers) y controles de calefactores.","4 A y 600 V.","Entre MT1 y MT2 no debe haber continuidad; entre compuerta y MT1 hay decenas de ohmios.","Trabajar con el lado de la red sin aislamiento: es peligroso."],["Tiristor SCR C106",2,"S","to220","C106","SCR C106D tiristor","Se enciende con un pulso en la compuerta y sigue conduciendo hasta que la corriente cae a cero; solo conduce en un sentido.","Alarmas con memoria, controles de potencia y cargadores.","4 A; compuerta de unos 200 µA.","Ánodo-cátodo sin continuidad; compuerta-cátodo muestra cientos de ohmios.","Esperar que se apague en CC al quitar la compuerta: hay que cortar la corriente principal."],["LED RGB (cátodo común)",1,"S","led3","RGB","LED RGB 5mm catodo comun","Tres LED (rojo, verde y azul) en una cápsula: al variar la corriente de cada uno se mezcla cualquier color.","Indicadores de estado, iluminación decorativa y señales con PWM.","Rojo ≈ 2 V; verde y azul ≈ 3 V; unos 20 mA por color con su propio resistor.","Con pila de 3 V y resistor, toca la pata común con el negativo y cada color por separado.","Compartir un solo resistor para los tres colores: los brillos salen desiguales."],["Fotodiodo BPW34",2,"S","disc","BPW34","fotodiodo BPW34","Diodo que genera una corriente pequeña proporcional a la luz que recibe; se usa polarizado en inverso.","Receptores infrarrojos, medidores de luz y barreras ópticas.","Decenas de µA con luz ambiental.","Con el multímetro en µA y luz fuerte, la lectura sube al iluminarlo.","Conectarlo en directo: así no mide luz."],["Termistor NTC 10 kΩ",1,"P","ntc","NTC 10k","termistor NTC 10k","Resistor cuyo valor baja al subir la temperatura. A 25 °C vale 10 kΩ y cae al calentarse.","Sensores de temperatura, limitadores de arranque y termostatos.","10 kΩ a 25 °C; beta cercana a 3950.","Mide su resistencia y caliéntalo con los dedos: debe bajar.","Usarlo en un divisor sin linealizar: la respuesta es curva."],["Varistor MOV 14D471",2,"P","disc","MOV","varistor 14D471 MOV","Resistor que baja mucho su valor cuando el voltaje supera su límite, desviando el pico a tierra.","Protectores de picos, regletas y entradas de fuentes.","14D471: unos 300 V de CA continuos.","Con el multímetro en ohmios debe marcar infinito; si hay continuidad, está dañado.","Dejarlo conectado cuando está oscurecido o quemado: ya no protege."],["Fusible de vidrio 5×20 mm",0,"P","fuse","5×20","fusible vidrio 5x20 mm 2A","Hilo calibrado que se funde si pasa más corriente de la indicada, abriendo el circuito para proteger lo demás.","Entrada de fuentes, electrodomésticos, autos y multímetros.","Rápido (F) o retardado (T), marcado en amperios y voltios.","En continuidad debe sonar; si no, está fundido.","Cambiarlo por uno de más amperaje o puentearlo: provoca incendios."],["Capacitor de poliéster 100 nF",0,"P","film","100 nF","capacitor poliester 100nF 104 63V","Capacitor sin polaridad, estable y de baja pérdida; el código 104 equivale a 100 nF.","Filtros, acoplo de audio y temporizadores.","De 10 nF a 1 µF; de 63 V a 630 V.","Con capacímetro mide cerca de su valor; no tiene polaridad.","Leer mal el código: 104 es 10 seguido de 4 ceros en pF."],["Transformador reductor 12 V",1,"P","xfmr","12 V","transformador 127V a 12V 1A","Dos bobinas sobre un núcleo: baja (o sube) el voltaje de CA según la relación de vueltas y aísla el secundario de la red.","Fuentes lineales, timbres y cargadores antiguos.","127 V a 12 V con 1 A (12 VA).","Mide resistencias: primario de decenas a cientos de ohmios, secundario de pocos ohmios.","Tocar el primario conectado: es voltaje de red."],["Cristal de cuarzo 16 MHz",2,"P","xtal","16 MHz","cristal cuarzo 16MHz HC-49","Pieza de cuarzo que vibra a una frecuencia muy exacta al aplicarle voltaje; da el reloj a los microcontroladores.","Relojes de Arduino y comunicaciones seriales precisas.","Se acompaña de dos capacitores de unos 22 pF a tierra.","Con multímetro no se prueba bien: usa osciloscopio o cámbialo.","Olvidar los capacitores de carga: no oscila."],["Regulador ajustable LM317",2,"C","to220","LM317","regulador LM317 TO-220","Regulador lineal cuya salida se ajusta con dos resistores: Vout = 1.25 V × (1 + R2/R1).","Fuentes variables y cargadores sencillos.","Salida de 1.25 a 37 V hasta 1.5 A; necesita unos 3 V de diferencia.","Mide Vout con carga ligera y gira el ajuste: debe seguir la fórmula.","Olvidar el disipador: pierde (Vin − Vout) × I en calor."],["Comparador LM393",2,"C","dip8","LM393","LM393 comparador DIP-8","Compara dos voltajes y su salida (colector abierto) pasa a bajo o a alto según cuál sea mayor.","Detectores de luz, de temperatura y de cruce por cero.","Alimentación de 2 a 36 V; salida con resistor pull-up.","Fija una entrada y mueve la otra con un potenciómetro: la salida cambia.","No ponerle pull-up a la salida: nunca sube a nivel alto."],["Driver de motores L298N",2,"C","mod","L298N","modulo driver motores L298N","Dos puentes H en un módulo: invierte el sentido y controla la velocidad (con PWM) de dos motores de CC.","Robots, carritos y mecanismos con motores de hasta 2 A.","Motor de hasta 46 V y 2 A por canal; cae cerca de 2 V.","Mide el voltaje de salida del canal al activar IN1 e IN2.","No unir la tierra del módulo con la del microcontrolador."],["Registro de desplazamiento 74HC595",2,"C","dip16","74HC595","74HC595 DIP-16","Convierte datos en serie (3 hilos) en 8 salidas paralelas y se puede encadenar para tener 16, 24 o más.","Ampliar salidas del microcontrolador para LEDs y displays.","Alimentación de 2 a 6 V; unos 6 mA por salida.","Envía un byte y mide las salidas con un LED y resistor.","Dejar sin conectar OE (a GND) y MR (a VCC)."],["Amplificador de audio LM386",1,"C","dip8","LM386","LM386 amplificador audio DIP-8","Amplificador de potencia de audio de bajo voltaje, ideal para bocinas pequeñas, con ganancia de 20 a 200.","Radios, bocinas portátiles y amplificadores didácticos.","Alimentación de 4 a 12 V; cerca de 0.5 W en 8 Ω.","Con señal de audio la bocina debe sonar sin zumbido; mide VCC en la pata 6.","Quitar el capacitor de salida de 220 µF: la bocina recibe CC y se calienta."],["Buzzer activo 5 V",0,"M","buz","5 V","buzzer activo 5V","Lleva su propio oscilador: al darle 5 V suena un pitido fijo. El pasivo necesita una señal con frecuencia.","Alarmas, avisos y temporizadores.","Unos 5 V y 30 mA.","Conéctalo a una pila de 3 a 5 V respetando el +: debe pitar.","Confundir activo con pasivo: el pasivo no suena con CC."],["Altavoz (bocina) de 8 Ω",0,"M","spk","8 Ω","bocina altavoz 8 ohm 0.5W","Convierte la señal eléctrica en sonido moviendo un cono con una bobina dentro de un campo magnético.","Radios, televisiones y bocinas portátiles.","Impedancia de 4 u 8 Ω y potencia en vatios.","Mide la bobina: cerca de 6 a 7 Ω en una de 8 Ω; infinito es bobina abierta.","Alimentarlo con más potencia que la nominal."],["Micrófono electret",1,"M","mic","electret","microfono electret 9mm","Cápsula que convierte el sonido en una pequeña señal eléctrica; necesita polarización de 2 a 5 V mediante un resistor.","Intercomunicadores, grabadoras y sensores de sonido.","Resistor de polarización típico de 2.2 a 10 kΩ.","Con resistor y 3 V, el voltaje en la unión debe variar al hablar.","Invertir la polaridad: la terminal unida a la carcasa va al negativo."],["Motor de CC pequeño",0,"M","motor","3–6 V","motor DC 3-6V","Convierte electricidad en giro: más voltaje, más velocidad; invertir la polaridad invierte el sentido.","Ventiladores, juguetes, robots y bombas pequeñas.","La corriente de arranque es varias veces la nominal.","Con una pila debe girar libre; en ohmios marca unos pocos ohmios.","Manejarlo directo desde un pin del microcontrolador, sin transistor ni diodo flyback."],["Servomotor SG90",1,"M","servo","SG90","servomotor SG90 9g","Motor con engranes y control: gira a un ángulo (0° a 180°) según el ancho de un pulso de 1 a 2 ms cada 20 ms.","Robots, brazos mecánicos y cerraduras.","De 4.8 a 6 V; unos 250 mA bajo carga.","Con un pulso de 1.5 ms debe quedarse al centro.","Alimentarlo desde el pin de 5 V de la placa: se reinicia al cargarse."],["Pantalla LCD 16×2",1,"M","lcd","16×2","LCD 16x2 HD44780 I2C","Muestra dos líneas de 16 caracteres; con el módulo I2C bastan 4 cables.","Termómetros, relojes y paneles de proyectos.","Alimentación de 5 V; contraste con un potenciómetro de 10 kΩ.","Si solo se ven cuadros en la primera línea, falta inicializar o ajustar el contraste.","Contraste mal ajustado: parece que no funciona."],["Sensor DHT11",1,"M","dht","DHT11","sensor DHT11 temperatura humedad","Mide temperatura y humedad y las envía como datos digitales por un solo hilo.","Estaciones meteorológicas y termostatos.","0 a 50 °C (±2 °C) y 20 a 80 % de humedad (±5 %).","Léelo una vez cada 2 s o más.","Leerlo más rápido de una vez por segundo: devuelve errores."],["Batería de litio 18650",2,"M","bat","18650","bateria 18650 3.7V","Celda recargable de iones de litio de 3.7 V nominales (4.2 V cargada y 3.0 V como mínimo).","Bancos de energía, linternas y proyectos portátiles.","De 1800 a 3500 mAh; no bajar de 3.0 V.","Mide su voltaje en reposo: con menos de 2.5 V no se debe recargar.","Cargarla sin módulo de protección: riesgo de incendio."],["Multímetro digital",0,"H","meter","DMM","multimetro digital","Mide voltaje, corriente y resistencia, y prueba continuidad y diodos; es la herramienta principal de diagnóstico.","Revisar pilas, cables, fusibles, fuentes y componentes.","Punta roja en VΩmA y negra en COM; elige la función antes de tocar.","Junta las puntas en continuidad: debe sonar; así sabes que funciona.","Medir voltaje con las puntas en la entrada de corriente: fundes el fusible."],["Cautín y soldadura",0,"H","iron","30 W","cautin 30W soldadura estaño 60/40","Calienta la unión para fundir el estaño y unir la pata con la pista, formando una conexión firme.","Armar circuitos definitivos y reparar soldaduras frías.","Punta a unos 330–370 °C; soldadura 60/40 con núcleo de resina.","Una buena soldadura queda brillante y en forma de cono, no opaca ni redonda.","Mover la pieza mientras enfría: queda una soldadura fría."]],"XTRA":[["LED (","Rojo ≈ 2 V, verde ≈ 2.2 V, azul o blanco ≈ 3 V; de 10 a 20 mA.","Con una pila de 3 V y un resistor de 220 Ω debe encender; en modo diodo el multímetro lo ilumina tenue.","Conectarlo al revés o sin resistor."],["Resistor","1/4 W y tolerancia de 5 % (banda dorada).","Mídelo fuera del circuito; debe coincidir con el código de colores.","Medirlo soldado: las demás piezas alteran la lectura."],["electrolítico","Desde 1 µF hasta miles de µF; usa un voltaje de trabajo 1.5 veces el de la fuente.","Un capacímetro mide su capacidad; si está abultado o tiene fuga, está dañado.","Conectarlo al revés (la franja indica el negativo): puede explotar."],["1N4007","1 A y 1000 V inversos; caída de 0.7 V.","En modo diodo marca entre 0.55 y 0.7 V en un sentido y OL en el otro.","Poner la franja del lado equivocado."],["2N2222","600 mA y 40 V; ganancia de 100 a 300.","En modo diodo, de base a emisor y de base a colector hay cerca de 0.65 V.","Olvidar el resistor de base."],["LM358","Alimentación de 3 a 32 V; la salida llega a cerca de VCC − 1.5 V.","Como seguidor de voltaje, la salida copia la entrada.","Usarlo en circuitos de alta frecuencia: es lento."],["555","De 4.5 a 15 V; salida de hasta 200 mA.","En astable, un LED en la salida debe parpadear según R y C.","Dejar la pata 4 (reset) sin conectar a VCC."],["LM7805","Entrada de 7 a 25 V; salida de 5 V hasta 1 A con disipador.","Mide 5 V entre la pata de salida y GND con entrada de 9 a 12 V.","Alimentarlo con 12 V y 1 A sin disipador: se sobrecalienta."],["Relé","Bobina de 5 V con unos 70 mA; contactos de 10 A a 250 V CA.","Al alimentar la bobina se oye un clic y hay continuidad entre COM y NO.","No poner el diodo flyback en la bobina."],["MOSFET","IRFZ44N: 49 A y 55 V; se activa bien con 10 V.","Descarga la compuerta antes de medir; en modo diodo hay caída solo de fuente a drenaje.","Manejar con 5 V la compuerta de un MOSFET que necesita 10 V."],["Potenciómetro","B10K es lineal; A es logarítmico (audio).","Entre los extremos mide su valor total; el cursor debe variar suave.","Confundir lineal con logarítmico en un control de volumen."],["Pulsador","Cuatro patas: las dos de un mismo lado están unidas.","En continuidad suena solo al presionar.","Conectarlo con las patas equivocadas: queda siempre cerrado."]],"GLO":[["Amperio (A)","Unidad de corriente eléctrica: cantidad de carga que pasa por segundo."],["Voltio (V)","Unidad de voltaje: la «presión» eléctrica que empuja la corriente."],["Ohm (Ω)","Unidad de resistencia eléctrica."],["Vatio (W)","Unidad de potencia: energía por segundo. P = V × I."],["Ley de Ohm","Relación V = I × R entre voltaje, corriente y resistencia."],["Corriente continua (CC)","Corriente que fluye siempre en un mismo sentido, como la de una pila."],["Corriente alterna (CA)","Corriente que cambia de sentido periódicamente, como la del enchufe (60 Hz en México)."],["Frecuencia","Número de ciclos por segundo, en hercios (Hz)."],["Periodo","Tiempo que dura un ciclo completo; es el inverso de la frecuencia."],["Tierra (GND)","Punto de referencia de 0 V al que se conectan los retornos del circuito."],["Cortocircuito","Camino sin resistencia entre puntos de distinto voltaje; provoca corriente muy alta."],["Circuito abierto","Camino interrumpido por el que no circula corriente."],["Serie","Conexión una tras otra: la misma corriente pasa por todos los elementos."],["Paralelo","Conexión lado a lado: todos los elementos reciben el mismo voltaje."],["Nodo","Punto donde se unen dos o más elementos de un circuito."],["Divisor de voltaje","Dos resistores en serie que entregan una fracción del voltaje de entrada."],["Pull-up","Resistor que lleva una entrada a nivel alto cuando nada la maneja."],["Pull-down","Resistor que lleva una entrada a nivel bajo cuando nada la maneja."],["Capacitancia","Capacidad de almacenar carga; se mide en faradios (F)."],["Constante de tiempo (τ)","Producto R × C: tiempo en que un capacitor llega al 63 % de su carga."],["Inductancia","Propiedad de una bobina de oponerse a los cambios de corriente; se mide en henrios (H)."],["Impedancia","Oposición total de un circuito a la CA: combina resistencia y reactancia."],["Reactancia","Oposición de capacitores e inductores a la CA, que depende de la frecuencia."],["Diodo","Componente que conduce en un solo sentido."],["Voltaje de caída (Vf)","Voltaje que se pierde en un diodo o LED al conducir."],["Zener","Diodo diseñado para conducir en inverso a un voltaje fijo."],["Rectificador","Circuito que convierte CA en CC pulsante usando diodos."],["Ripple (rizado)","Ondulación residual que queda en la CC tras rectificar y filtrar."],["Transistor","Componente de tres terminales que funciona como interruptor o amplificador."],["Ganancia","Cuántas veces una señal se hace más grande."],["Saturación","Estado en que un transistor conduce al máximo, como interruptor cerrado."],["Corte","Estado en que un transistor no conduce, como interruptor abierto."],["Compuerta (gate)","Terminal de control de un MOSFET, triac o SCR."],["PWM","Modulación por ancho de pulso: controla potencia variando el tiempo en alto."],["Ciclo de trabajo","Porcentaje del periodo en que una señal PWM está en alto."],["ADC","Convertidor analógico-digital: mide un voltaje y lo entrega como número."],["Microcontrolador","Chip con procesador, memoria y pines que ejecuta un programa."],["Protoboard","Tablero con contactos para armar circuitos sin soldar."],["Soldadura fría","Unión opaca o mal fundida que conduce mal o de forma intermitente."],["Continuidad","Existencia de un camino eléctrico sin interrupciones entre dos puntos."],["Tolerancia","Variación permitida entre el valor real de un componente y el nominal."],["Regulador","Circuito que mantiene estable el voltaje de salida."],["Fuente conmutada","Fuente que conmuta a alta frecuencia para convertir voltaje con poca pérdida."],["Filtro pasa-bajas","Circuito que deja pasar las bajas frecuencias y atenúa las altas."],["Ruido","Señales no deseadas que se mezclan con la señal útil."],["Blindaje","Cubierta metálica a tierra que protege una señal de interferencias."],["Optoacoplador","Pieza que transmite una señal con luz para aislar dos circuitos."],["Relé","Interruptor accionado por una bobina electromagnética."],["Diodo flyback","Diodo en paralelo con una bobina que absorbe el pico de voltaje al apagarla."],["Hoja de datos","Documento del fabricante con las características y límites de una pieza (datasheet)."],["SMD","Componente de montaje superficial, sin patas que atraviesen la placa."],["THT","Componente de orificio pasante, con patas que se sueldan por el otro lado."],["Pila","Dispositivo que convierte energía química en eléctrica y normalmente no se recarga."],["mAh","Miliamperios-hora: capacidad de una batería."],["Osciloscopio","Instrumento que dibuja el voltaje en función del tiempo."],["Multímetro","Instrumento que mide voltaje, corriente, resistencia y más."],["Lazo de tierra","Dos caminos a tierra con distinto potencial que meten zumbido en audio."],["Corriente de fuga","Pequeña corriente que circula cuando no debería, por ejemplo en un diodo en inverso."],["Inrush","Pico de corriente al encender un aparato con capacitores o motor."]],"SEG":[["Voltaje de red (110 o 220 V)",4,"Una descarga puede causar quemaduras, fibrilación y la muerte.","Desconecta, comprueba que no haya voltaje y no trabajes mojado ni descalzo.","No toques a la persona: corta la energía y llama a emergencias."],["Hornos de microondas y fuentes de alto voltaje",4,"Guardan miles de voltios en capacitores aun desconectados.","No los abras si no tienes capacitación.","Pide ayuda profesional."],["Baterías de litio",4,"Hinchadas, dañadas o en corto pueden incendiarse.","Usa módulo de protección, no las perfores ni las cargues sin vigilar.","Si humea, sácala a un lugar abierto sobre una superficie no inflamable, aléjate y llama a emergencias si hay fuego."],["Capacitores cargados",3,"Almacenan energía aun desconectados (fuentes, flashes, televisores).","Descárgalos con un resistor de 1 a 10 kΩ y mide antes de tocar.","Si hay quemadura, enfría la zona y busca atención médica."],["Cautín y soldadura",3,"La punta supera los 300 °C y el humo de resina irrita.","Usa soporte, ventila y lávate las manos al terminar.","Enfría la quemadura con agua fresca de 10 a 20 minutos."],["Cortocircuito en fuentes",3,"Puede calentar los cables y provocar fuego.","Usa fusibles del valor correcto y cables del calibre adecuado.","Desconecta y deja enfriar; busca el corto antes de volver a conectar."],["Calor en componentes",2,"Reguladores, resistores y MOSFET pueden pasar de 80 °C.","Calcula la potencia y usa disipador.","No los toques; espera a que enfríen."],["Motores y piezas móviles",2,"Atrapan dedos, cabello y ropa.","Desconecta antes de ajustar y sujeta las piezas.","Apaga de inmediato."],["Pilas que se derraman",2,"Las alcalinas pueden derramar; mezclar pilas nuevas con viejas las sobrecalienta.","Cambia todas juntas y no las dejes dentro de aparatos sin uso.","Usa guantes y limpia con un paño con vinagre o jugo de limón."],["Humo de plástico quemado",2,"Los componentes quemados desprenden gases irritantes.","Trabaja con ventilación y no respires el humo.","Sal a un lugar con aire fresco y ventila."],["Descarga electrostática (ESD)",1,"Daña circuitos integrados y MOSFET sin que lo notes.","Toca una superficie metálica a tierra y usa pulsera antiestática.","Si dejó de funcionar tras manipularlo, reemplaza la pieza."]],"HIS":[[1800,"Alessandro Volta presenta la pila voltaica, la primera fuente continua de electricidad."],[1827,"Georg Ohm publica la relación entre voltaje, corriente y resistencia."],[1831,"Michael Faraday descubre la inducción electromagnética, base de motores y generadores."],[1879,"Thomas Edison perfecciona la lámpara incandescente práctica."],[1904,"John Ambrose Fleming inventa el diodo de vacío."],[1906,"Lee de Forest inventa el audión, la primera válvula amplificadora."],[1947,"En Bell Labs se crea el transistor (Bardeen, Brattain y Shockley)."],[1958,"Jack Kilby construye el primer circuito integrado en Texas Instruments."],[1962,"Nick Holonyak desarrolla el primer LED de luz visible, de color rojo."],[1971,"Intel presenta el 4004, el primer microprocesador comercial; ese año Hans Camenzind diseña el 555."],[1991,"Sony comercializa la primera batería de iones de litio."],[2005,"Nace Arduino en Italia y acerca los microcontroladores a estudiantes y aficionados."],[2012,"Sale a la venta la Raspberry Pi, una computadora completa del tamaño de una tarjeta."]],"FACTS":["Un LED puede durar entre 25 000 y 50 000 horas encendido.","Bastan unos 100 mA atravesando el corazón para ser peligrosos: la corriente, más que el voltaje, es lo que daña.","Un celular moderno tiene más de diez mil millones de transistores.","Los electrones se mueven muy despacio en un cable, pero la señal viaja a cerca de dos tercios de la velocidad de la luz.","Los resistores usan bandas de colores porque son tan pequeños que imprimir números sería ilegible.","El ATmega328P del Arduino UNO trabaja a 16 MHz: unos 16 millones de ciclos por segundo.","Muchas fallas de electrodomésticos son cables, fusibles, interruptores y soldaduras frías, no el chip principal.","Los capacitores electrolíticos viejos pierden capacidad: son una causa frecuente de fuentes y televisores que no encienden.","El LED azul llegó en los años 90 y su invención ganó el Nobel de Física en 2014.","Una pila de 9 V contiene seis celdas de 1.5 V en serie.","En México la red es de 127 V a 60 Hz; en Europa suele ser de 230 V a 50 Hz.","El multímetro mide resistencia enviando una pequeña corriente: por eso nunca se mide con el circuito energizado.","El estaño de soldar se derrite cerca de 190 °C, pero el cautín trabaja a unos 350 °C.","El zumbido de 60 Hz en un equipo de audio suele venir de un lazo de tierra.","La cámara de tu celular sí ve la luz infrarroja de un control remoto: aparece como un destello morado.","Las baterías de litio no deben bajar de 3 V por celda ni pasar de 4.2 V.","La computadora ENIAC usaba cerca de 18 000 tubos de vacío.","El LM358 contiene dos amplificadores operacionales en un solo encapsulado.","Una descarga estática que ni sientes (menos de 3000 V) puede dañar un chip.","El 555 es uno de los circuitos integrados más vendidos de la historia.","Un capacitor puede conservar carga peligrosa mucho después de desconectar el aparato.","Un resistor de 1/4 W se oscurece y huele a quemado si disipa mucho más que 0.25 W.","Los cables con número AWG menor son más gruesos: un AWG 12 soporta más corriente que un AWG 22.","El código 104 en un capacitor significa 10 seguido de 4 ceros en picofaradios: 100 nF."],"QF":[["¿Qué componente se usa para guardar carga eléctrica?","Capacitor","Resistor|Diodo|Fusible","El capacitor almacena carga entre sus placas."],["¿Qué mide un amperímetro?","La corriente","El voltaje|La resistencia|La frecuencia","Se mide en amperios (A) y se conecta en serie."],["¿En qué unidad se mide el voltaje?","Voltio (V)","Ohm (Ω)|Amperio (A)|Henrio (H)","El voltaje se mide en voltios."],["¿Qué significa que un circuito está abierto?","Que hay un corte y no circula corriente","Que circula el doble de corriente|Que no tiene fuente|Que está en cortocircuito","Un circuito abierto interrumpe el camino de la corriente."],["¿Qué es un cortocircuito?","Un camino sin resistencia que provoca corriente muy alta","Un circuito apagado|Un cable demasiado largo|Un resistor de valor alto","Sin resistencia que la limite, la corriente se dispara y puede causar fuego."],["Caso real: tu bocina no enciende aunque está conectada. ¿Qué revisas primero?","Que la toma tenga corriente y el cable esté bien","Cambiar el altavoz|Soldar el amplificador|Abrir el transformador","Empieza por lo más simple y barato: toma, cable y fusible."],["¿Cuál de estos materiales es aislante?","Plástico","Cobre|Aluminio|Oro","El plástico no deja pasar la corriente; los metales sí."],["¿Qué hace un resistor?","Limita el paso de la corriente","Genera voltaje|Almacena carga|Amplifica señales","Se opone al paso de la corriente según su valor en ohmios."],["¿Qué indica la franja de un capacitor electrolítico?","El terminal negativo","El terminal positivo|La tolerancia|El voltaje máximo","La franja marca la pata negativa; conectarlo al revés puede dañarlo."],["¿Qué herramienta se usa para unir piezas con estaño?","Cautín","Multímetro|Pinzas de corte|Protoboard","El cautín calienta la unión para fundir la soldadura."],["¿Cuántos voltios entrega un puerto USB estándar?","5 V","1.5 V|12 V|127 V","USB estándar entrega cerca de 5 V."],["Caso real: tu cargador no carga el celular. ¿Qué pruebas primero?","Otro cable y otro cargador","Cambiar la pantalla|Resoldar el procesador|Formatear el celular","La prueba cruzada con otro cable y otro cargador descarta lo más común."],["¿Qué componente emite luz al pasar corriente?","LED","Resistor|Capacitor|Transformador","El LED convierte la corriente en luz."],["¿Qué puede pasar si inviertes la polaridad de las pilas de un aparato?","Puede no funcionar o dañarse","Funciona mejor|Se recargan las pilas|Nunca pasa nada","Muchos circuitos no toleran la polaridad invertida."],["¿Qué es la tierra (GND) en un circuito?","El punto de referencia de 0 V","La fuente de energía|El resistor principal|El interruptor","Todos los voltajes se miden respecto a ese punto."],["¿Qué componente rectifica, es decir, deja pasar la corriente en un solo sentido?","Diodo","Resistor|LED de colores solamente|Potenciómetro","El diodo conduce en un solo sentido."],["¿Con qué función del multímetro compruebas si un cable está roto?","Continuidad","Frecuencia|Capacitancia|Temperatura","En continuidad suena si el camino está completo."],["¿Para qué sirven los rieles laterales de una protoboard?","Para distribuir + y − a todo el circuito","Para guardar componentes|Para sujetar el cautín|Para medir voltaje","Los rieles llevan la alimentación a lo largo de la placa."],["¿Cuánto vale un resistor con bandas rojo, rojo y marrón?","220 Ω","22 Ω|2.2 kΩ|221 Ω","22 × 10 = 220 Ω."],["¿Qué magnitud se mide en vatios?","La potencia","La resistencia|La corriente|El voltaje","El vatio mide potencia: energía por segundo."],["Caso real: el foco LED de una lámpara parpadea. ¿Qué revisas primero?","El portalámparas y el foco","La instalación de toda la casa|El medidor de luz|La antena","Empieza por lo más cercano: foco y contacto del portalámparas."],["¿Qué es una pila recargable?","Una que se puede cargar y usar muchas veces","Una que nunca se gasta|Una de un solo uso|Una sin polaridad","Las recargables se vuelven a llenar con un cargador adecuado."],["¿Qué indica «mAh» en una batería?","Su capacidad","Su voltaje|Su tamaño|Su velocidad","Los miliamperios-hora indican cuánta carga puede entregar."],["¿Qué tipo de corriente llega a los enchufes de una casa?","Alterna (CA)","Continua (CC)|Pulsante de CC|Ninguna","La red doméstica es de corriente alterna."],["¿Qué pasa si un fusible recibe demasiada corriente?","Se funde y corta el circuito","Se enciende|Guarda la corriente|Aumenta el voltaje","Se sacrifica para proteger el resto del circuito."]],"QI":[["¿Qué tolerancia indica la banda dorada de un resistor?","±5 %","±1 %|±10 %|±20 %","Dorado equivale a 5 % de tolerancia."],["Un resistor de 1 kΩ conectado a 10 V disipa…","100 mW","10 mW|1 W|10 W","P = V²/R = 100/1000 = 0.1 W."],["¿Qué diodo se usa como referencia de voltaje?","Zener","Schottky|LED|Rectificador común","El Zener conduce en inverso a un voltaje fijo."],["¿Cuál es la frecuencia de la red eléctrica en México?","60 Hz","50 Hz|100 Hz|127 Hz","En México la red es de 127 V a 60 Hz."],["¿Para qué sirve un optoacoplador?","Aislar eléctricamente dos circuitos pasando la señal con luz","Amplificar audio|Medir temperatura|Almacenar carga","Un LED y un fototransistor separan eléctricamente los lados."],["¿Qué componente se opone a los cambios bruscos de corriente?","Inductor","Capacitor|Resistor|Diodo","La bobina se opone a los cambios de corriente."],["¿Qué componente se opone a los cambios bruscos de voltaje?","Capacitor","Inductor|Diodo|Fusible","El capacitor almacena carga y suaviza los cambios de voltaje."],["En modo diodo, un diodo de silicio en buen estado marca…","Unos 0.5 a 0.7 V en un sentido y OL en el otro","OL en ambos sentidos|0 V en ambos sentidos|10 V en un sentido","Conduce en directo y bloquea en inverso."],["¿Qué pasa si mides resistencia en un circuito energizado?","La lectura es errónea y puedes dañar el multímetro","Mides mejor|Se enciende el circuito|Nada","La resistencia se mide siempre sin energía."],["¿Qué corriente por pin recomienda un Arduino UNO como máximo habitual?","Unos 20 mA","1 A|500 mA|2 mA","Se recomiendan 20 mA por pin; 40 mA es el límite absoluto."],["¿Cuántos bits tiene el ADC de un Arduino UNO?","10 bits","8 bits|12 bits|16 bits","El ADC del UNO entrega valores de 0 a 1023."],["¿Qué significa PWM?","Modulación por ancho de pulso","Voltaje de paso múltiple|Protección de media onda|Potencia máxima del motor","PWM varía el tiempo en alto para controlar potencia."],["Con una señal PWM de 5 V y 50 % de ciclo de trabajo, el voltaje promedio es…","2.5 V","5 V|0 V|10 V","El promedio es el ciclo de trabajo por el voltaje: 0.5 × 5 V."],["¿Qué resistor pull-down se usa típicamente en un botón?","10 kΩ","100 Ω|1 Ω|10 MΩ","10 kΩ mantiene la entrada baja sin gastar mucha corriente."],["Caso real: el ventilador de tu PC gira lento y hace ruido. ¿Qué haces primero?","Limpiar el polvo y revisar el rodamiento","Cambiar la fuente|Sustituir el procesador|Subir el voltaje","El polvo y los rodamientos secos son las causas más comunes."],["Al conectar resistores en paralelo, la corriente total…","Se suma","Disminuye|Es cero|Es igual a la de uno solo","Cada rama toma su corriente y la fuente entrega la suma."],["En resistores en serie, el voltaje…","Se reparte entre ellos","Es igual en todos|Se suma en cada uno|Es cero","La suma de las caídas es igual al voltaje de la fuente."],["¿Cuánto cae en un LED rojo típico?","Cerca de 2 V","0.2 V|5 V|12 V","Un LED rojo cae unos 2 V."],["¿Qué función tiene un cristal de cuarzo en un microcontrolador?","Dar un reloj estable","Guardar el programa|Regular el voltaje|Medir temperatura","El cuarzo vibra a una frecuencia exacta que sirve de reloj."],["¿Qué componente cambia su resistencia con la luz?","Fotorresistencia (LDR)","Zener|Triac|Relé","La LDR baja su resistencia al recibir más luz."],["¿Cuántos pines tiene un NE555 en encapsulado DIP?","8","6|14|16","El NE555 DIP tiene 8 pines."],["¿Para qué sirve un disipador?","Evacuar el calor de un componente","Aumentar la corriente|Filtrar ruido|Guardar energía","Aumenta la superficie para enfriar el componente."],["¿Cómo se prueba un fusible con el multímetro?","En continuidad: debe sonar","En voltios|En capacitancia|En frecuencia","Un fusible sano tiene continuidad."],["¿Qué es el ripple?","La ondulación residual en una fuente rectificada","Un tipo de resistor|El ruido de un motor|Un voltaje negativo","Es lo que queda de la onda tras rectificar y filtrar."],["¿Cuál es la ley de Ohm despejada para la resistencia?","R = V / I","R = V × I|R = I / V|R = V² × I","De V = I × R se despeja R = V / I."],["Para medir la corriente de un circuito, el multímetro se conecta…","En serie con el circuito","En paralelo con la fuente|Sin conectarlo|Solo con una punta","La corriente se mide intercalando el instrumento."],["Caso real: tu televisor tiene el piloto encendido pero no hay imagen. ¿Qué es probable?","La luz de fondo o la tarjeta de video","La antena del control|El cable de corriente|El fusible del enchufe","Si hay piloto y sonido, la fuente funciona; falla la imagen."],["¿Qué indica el código 473 en un capacitor cerámico?","47 nF","473 pF|4.7 µF|47 pF","47 seguido de tres ceros en pF son 47 000 pF = 47 nF."],["¿Qué diferencia hay entre un buzzer activo y uno pasivo?","El activo trae su oscilador interno","El pasivo es más potente|El activo no usa voltaje|No hay diferencia","El activo suena con solo darle voltaje."],["¿Qué es una soldadura fría?","Una unión opaca y mal fundida que conduce mal","Una hecha con estaño sin plomo|Una hecha sin cautín|Una unión muy brillante","No se fundió bien y causa fallas intermitentes."]],"QA":[["¿Qué voltaje da un LM317 con R1 = 240 Ω y R2 = 720 Ω?","5 V","1.25 V|3.75 V|12 V","Vout = 1.25 × (1 + 720/240) = 5 V."],["¿Cuánta energía guarda un capacitor de 1000 µF a 10 V?","50 mJ","100 mJ|5 J|1 mJ","E = ½·C·V² = 0.5 × 0.001 × 100 = 0.05 J."],["¿Qué frecuencia tiene una señal de periodo 2 ms?","500 Hz","50 Hz|2 kHz|5 kHz","f = 1/T = 1/0.002 = 500 Hz."],["Un transformador de 127 V a 12 V tiene una relación de vueltas de…","Cerca de 10.6 a 1","Cerca de 1 a 10.6|Cerca de 5 a 1|Cerca de 115 a 1","La relación de vueltas es igual a la de voltajes: 127/12 ≈ 10.6."],["¿Cuánta potencia disipa un resistor de 100 Ω con 0.5 A?","25 W","50 W|5 W|0.25 W","P = I²·R = 0.25 × 100 = 25 W."],["¿Para qué sirve un snubber con un triac?","Evitar disparos falsos con cargas inductivas","Subir el voltaje|Filtrar audio|Medir corriente","Absorbe los picos de dv/dt de las cargas inductivas."],["¿Qué ganancia tiene un amplificador inversor con Rf = 47 kΩ y Rin = 4.7 kΩ?","−10","10|−1|0.1","La ganancia es −Rf/Rin = −10."],["¿Qué resolución tiene un ADC de 12 bits con referencia de 3.3 V?","Cerca de 0.8 mV","3.3 mV|0.1 mV|8 mV","3.3 V / 4096 ≈ 0.8 mV por paso."],["Caso real: un MOSFET se calienta al mover un motor con PWM. ¿Qué mejora más?","Un MOSFET de nivel lógico con menor Rds(on) y la compuerta bien excitada","Bajar el PWM a 1 Hz|Quitar el diodo flyback|Alimentar con menos voltaje","Menos resistencia de conducción significa menos pérdida y calor."],["¿Qué es el rebote (bounce) de un botón?","Varios contactos rápidos al pulsar que se leen como pulsaciones múltiples","Un error del cautín|Un pico de red|La caída de la batería","Se corrige con un capacitor o con antirrebote por software."],["¿Qué da una compuerta NAND con las dos entradas en 1?","0","1|Indefinido|Alta impedancia","NAND es AND invertida: 1 y 1 dan 0."],["¿Cuánto vale 1011 en binario?","11","13|10|9","8 + 0 + 2 + 1 = 11."],["¿Cuál es el valor hexadecimal de 255?","FF","0F|F0|100","255 = 15 × 16 + 15 = FF."],["Un divisor de 10 kΩ y 10 kΩ con Vin = 10 V y una carga de 10 kΩ en la salida entrega…","Cerca de 3.3 V","5 V|2.5 V|10 V","R2 en paralelo con la carga vale 5 kΩ: Vout = 10 × 5/(10+5) ≈ 3.3 V."],["¿Qué significa Rds(on) en un MOSFET?","La resistencia entre drenaje y fuente cuando conduce","El voltaje de compuerta|La capacitancia de entrada|La corriente de fuga","Mientras menor sea, menos calor genera el MOSFET."],["¿Qué es la impedancia?","La oposición total a la CA (resistencia y reactancia)","La resistencia de una pila|El voltaje pico|La frecuencia de resonancia","Combina resistencia y reactancia y se mide en ohmios."],["¿Qué filtro deja pasar bajas frecuencias y atenúa las altas?","Pasa-bajas","Pasa-altas|Pasa-banda|Rechaza-banda","Es el filtro RC más común."],["Caso real: tu amplificador de audio zumba a 60 Hz. ¿Qué buscas primero?","Lazos de tierra y el filtrado de la fuente","La punta del cautín|El cable HDMI|La antena","El zumbido de 60 Hz suele venir de tierras mal conectadas o de poco filtrado."],["¿A qué velocidad aproximada viaja una señal por un cable?","Cerca de dos tercios de la de la luz","La del sonido|1 m/s|Exactamente la de la luz","Depende del aislante, pero ronda el 66 %."],["¿Qué eficiencia típica tiene un regulador buck?","Entre 80 y 95 %","Entre 30 y 40 %|Siempre 100 %|10 %","Conmuta, por eso casi no se calienta."],["¿Qué es la corriente de arranque (inrush)?","El pico inicial al encender motores o capacitores","La corriente mínima|La corriente en reposo|La corriente de fuga","Al encender, un capacitor vacío o un motor piden mucha corriente."],["¿Qué diodo conviene en un buck por su baja caída?","Schottky","Zener|1N4007|LED","El Schottky cae unos 0.3 V y conmuta rápido."],["En un termistor NTC, al subir la temperatura la resistencia…","Disminuye","Aumenta|No cambia|Se vuelve infinita","NTC significa coeficiente de temperatura negativo."],["¿Qué calibre de cable es más grueso?","AWG 12","AWG 22|AWG 30|AWG 40","A menor número AWG, mayor diámetro."],["¿Cuál es la frecuencia de resonancia de un circuito LC?","f = 1 / (2π√(LC))","f = 1 / (2πRC)|f = LC / 2π|f = 2π√(LC)","Se obtiene cuando las reactancias de L y C son iguales."]],"LES":[{"id":"l6","t":"Serie y paralelo","min":6,"obj":["Calcular la resistencia en serie y en paralelo","Saber qué se reparte en cada conexión"],"p":[["En serie: un solo camino","<p>Si conectas las piezas una tras otra, por todas pasa la <b>misma corriente</b> y el voltaje se reparte. Las resistencias se suman: <b>R = R1 + R2</b>.</p>"],["En paralelo: varios caminos","<p>Si las conectas lado a lado, todas reciben el <b>mismo voltaje</b> y la corriente se reparte. La equivalente es menor que la menor: <b>R = R1·R2 / (R1 + R2)</b>.</p>"],["Dónde se nota","<p>Las series de luces antiguas se apagaban todas si una fallaba (serie). En casa, los enchufes van en paralelo: cada aparato recibe el mismo voltaje.</p>"]],"q":[["Dos resistores de 100 Ω en paralelo valen…","50 Ω","200 Ω|100 Ω|25 Ω","Con valores iguales en paralelo, el total es la mitad: 50 Ω."],["En un circuito en serie, ¿qué es igual en todos los elementos?","La corriente","El voltaje|La potencia|La resistencia","En serie hay un solo camino: la misma corriente pasa por todos."]],"lab":"sp"},{"id":"l7","t":"Diodos y rectificación","min":6,"obj":["Explicar cómo conduce un diodo","Entender cómo se rectifica la CA"],"p":[["Una válvula de un solo sentido","<p>El diodo deja pasar la corriente del ánodo al cátodo y la bloquea al revés. La franja del cuerpo marca el cátodo.</p>"],["El umbral de 0.7 V","<p>Un diodo de silicio empieza a conducir cerca de <b>0.7 V</b>; el Schottky, cerca de 0.3 V; un LED, entre 2 y 3 V. Por eso casi siempre lleva un resistor en serie.</p>"],["Rectificar","<p>Con un diodo conviertes la mitad de la onda de CA en pulsos de un solo sentido; con un puente de cuatro diodos aprovechas las dos mitades y un capacitor las alisa.</p>"]],"q":[["¿Qué marca la franja de un diodo?","El cátodo","El ánodo|El voltaje máximo|La corriente máxima","La franja señala el cátodo, hacia donde conduce."],["¿Cuántos diodos tiene un puente rectificador?","Cuatro","Dos|Tres|Seis","El puente usa cuatro diodos para aprovechar toda la onda."]],"lab":"dio"},{"id":"l8","t":"El transistor como interruptor","min":7,"obj":["Reconocer base, colector y emisor","Calcular el resistor de base"],"p":[["Tres terminales","<p>El transistor NPN tiene <b>base, colector y emisor</b>. Una corriente pequeña en la base controla una corriente grande entre colector y emisor.</p>"],["Corte y saturación","<p>Con la base a 0 V no conduce (<b>corte</b>). Con una corriente de base de aproximadamente una décima de la del colector entra en <b>saturación</b> y actúa como un interruptor cerrado.</p>"],["El resistor de base","<p>Entre el microcontrolador y la base va siempre un resistor. Con 5 V y 2 mA de base: R = (5 − 0.7) / 0.002 ≈ 2.2 kΩ.</p>"]],"q":[["¿Qué debe llevar siempre la base de un transistor conectada a un microcontrolador?","Un resistor en serie","Un capacitor grande|Un fusible|Nada","El resistor limita la corriente de base y protege la unión."],["Un transistor en saturación se comporta como…","Un interruptor cerrado","Un interruptor abierto|Un capacitor|Una batería","En saturación conduce al máximo entre colector y emisor."]],"lab":"tr"},{"id":"l9","t":"Código de colores y prefijos","min":5,"obj":["Leer el valor de un resistor","Convertir entre mili, kilo y mega"],"p":[["Las bandas","<p>Las dos primeras bandas son dígitos, la tercera es el multiplicador y la cuarta, la tolerancia (dorado = 5 %). Rojo, rojo, marrón es 22 × 10 = 220 Ω.</p>"],["Los colores","<p>Negro 0, marrón 1, rojo 2, naranja 3, amarillo 4, verde 5, azul 6, violeta 7, gris 8 y blanco 9.</p>"],["Prefijos","<p><b>k</b> (kilo) = 1000, <b>M</b> (mega) = 1 000 000, <b>m</b> (mili) = 0.001 y <b>µ</b> (micro) = 0.000001. Así, 4700 Ω = 4.7 kΩ y 0.02 A = 20 mA.</p>"]],"q":[["Un resistor amarillo, violeta y rojo vale…","4.7 kΩ","470 Ω|47 kΩ|4.7 Ω","47 × 100 = 4700 Ω = 4.7 kΩ."],["¿Cuántos mA son 0.25 A?","250 mA","25 mA|2.5 mA|2500 mA","0.25 A × 1000 = 250 mA."]],"game":"col"},{"id":"l10","t":"El multímetro en la práctica","min":5,"obj":["Conectar bien las puntas","Elegir la función correcta"],"p":[["Conexiones","<p>La punta negra va en <b>COM</b> y la roja en <b>VΩmA</b> para voltaje, resistencia y continuidad. Para corrientes altas se usa la entrada de 10 A, siempre en serie.</p>"],["Voltaje y continuidad","<p>El voltaje se mide en <b>paralelo</b> y con el circuito energizado. La continuidad y la resistencia se miden siempre con el circuito desenergizado.</p>"],["Errores comunes","<p>Medir voltaje con las puntas en la entrada de corriente funde el fusible del multímetro. Antes de medir, selecciona la función y la escala correctas.</p>"]],"q":[["¿Cómo se conecta el multímetro para medir corriente?","En serie con el circuito","En paralelo con la fuente|Sin conectar|Solo con una punta","Para medir corriente, el multímetro se intercala en serie."],["¿Qué pasa si mides voltaje con las puntas en la entrada de corriente?","Puedes fundir el fusible o provocar un corto","Mides mejor|Nada|Se apaga el circuito","La entrada de corriente es casi un corto y la fuente lo alimenta."]],"go":"dudas"},{"id":"l11","t":"Binario y compuertas","min":6,"obj":["Pasar de binario a decimal","Reconocer AND, OR, NOT y NAND"],"p":[["Ceros y unos","<p>La electrónica digital usa dos niveles: 0 (bajo) y 1 (alto). Con 4 bits cuentas de 0 a 15; 1011 en binario vale 8 + 2 + 1 = 11.</p>"],["Compuertas","<p><b>AND</b> da 1 solo si todas las entradas son 1; <b>OR</b> da 1 si alguna es 1; <b>NOT</b> invierte; <b>NAND</b> es AND invertida y es «universal»: con ella se arma cualquier función.</p>"],["Niveles lógicos","<p>En un sistema de 5 V, más de unos 3 V se lee como 1 y menos de 1.5 V como 0. Entre ambos la lectura es incierta, por eso se usan resistores pull-up y pull-down.</p>"]],"q":[["¿Cuánto vale 1101 en binario en decimal?","13","11|15|9","8 + 4 + 0 + 1 = 13."],["¿Qué compuerta da 1 solo si todas sus entradas son 1?","AND","OR|NOT|XOR","La AND exige que todas las entradas sean 1."]]}]};

 box.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;lv=+b.dataset.v;$$('[data-v]',box).forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};draw()}
function wikiHis(box){box.innerHTML='<p>Algunos momentos que hicieron posible la electrónica de hoy.</p><ol class="tl">'+NEW.HIS.map(([y,x],i)=>`<li class="rv" style="--i:${i%3}"><b>${y}</b><p>${x}</p></li>`).join('')+'</ol>';reveal(box)}
function wiki(el){
 let sec=WIKISEC||'comp';WIKISEC='';

 const box=$('#sbox',el);

const TREE={"rBobina":{"r":"Bobina de voz abierta","S":[{"n":"Resoldar el cable de la bobina","t":"Un OL indica interrupción; con frecuencia el hilo flexible se rompe junto a la terminal. Retirar el esmalte, estañar y soldar de nuevo sin tocar el cono.","s":"El hilito que lleva el sonido al cono se soltó: vuélvelo a soldar con cuidado.","d":"spk"},{"n":"Reemplazar el altavoz","t":"Sustituir por uno con la misma impedancia, potencia y diámetro.","s":"Compra uno igual (mismos ohmios y tamaño) y cámbialo.","d":"spk"}],"mine":"Mediría la bobina de voz antes de comprar nada: si marca OL, primero intento resoldar el hilo y solo si falla cambio el altavoz.","steps":["Desconectar la bocina","Medir en ohmios","Buscar el hilo roto","Resoldar el cable","Cambiar el altavoz"]},"rConexion":{"r":"Falla en cable, conector o amplificador","S":[{"n":"Revisar y limpiar conectores","t":"Verificar la continuidad del cable y de los terminales; limpiar contactos oxidados con alcohol isopropílico.","s":"Revisa que el cable y las clavijas no estén flojos ni sucios.","d":"bridge"},{"n":"Aislar el fallo con otra fuente y otra bocina","t":"Alternar fuente de audio y bocina de prueba para determinar si falla la etapa de entrada, la de potencia o el altavoz.","s":"Prueba con otro celular y otra bocina: así descubres qué pieza es la culpable.","d":"spk"}],"mine":"Haría la prueba cruzada con otra fuente y otra bocina: en un minuto sé si falla el cable, el conector o el amplificador.","steps":["Probar otra fuente","Probar otra bocina","Limpiar conectores","Revisar el cable","Reparar o cambiar"]},"rRuido":{"r":"Zumbido o estática por filtrado deficiente o lazo de tierra","S":[{"n":"Añadir capacitores de desacoplo","t":"Colocar un electrolítico de 100 µF o más en paralelo con un cerámico de 100 nF entre VCC y GND, lo más cerca posible del amplificador.","s":"Los capacitores son como pequeños tanques que “alisan” la energía y reducen el zumbido.","d":"filt"},{"n":"Eliminar el lazo de tierra","t":"Unir las tierras en un solo punto (conexión en estrella) y usar cables cortos o blindados para la señal; un zumbido de 50 o 60 Hz suele indicar este problema.","s":"Si varios cables de tierra forman un “anillo”, captan zumbido: haz que todos lleguen a un mismo punto.","d":"filt"}],"mine":"Empezaría por el lazo de tierra (llevar todas las tierras a un punto) y después añadiría capacitores de desacoplo.","steps":["Unir tierras en un punto","Acortar los cables","Añadir desacoplo","Alejar cables de red","Probar de nuevo"]},"rDrift":{"r":"Drift: potenciómetro del joystick desgastado","S":[{"n":"Ajustar la zona muerta (deadzone)","t":"El cursor del potenciómetro entrega un voltaje que ya no es el del centro. Definir en software una zona muerta (por ejemplo 10 a 15 % del recorrido) ignora esa desviación.","s":"El control cree que el palo está inclinado aunque no lo toques; le dices que ignore los movimientos muy pequeños.","d":"joy"},{"n":"Limpiar o reemplazar el módulo del joystick","t":"Limpiar la pista resistiva con alcohol isopropílico; si el desgaste persiste, sustituir el módulo de potenciómetros del mismo modelo.","s":"Con el uso, la pista interna se ensucia o se gasta: límpiala y, si no mejora, cambia la pieza.","d":"joy"}],"mine":"Primero ajustaría la zona muerta por software y, si el drift crece, limpiaría o cambiaría el módulo del joystick.","steps":["Calibrar el control","Ajustar la zona muerta","Limpiar con alcohol","Cambiar el módulo","Probar de nuevo"]},"rPad":{"r":"Botón con almohadilla conductora sucia o desgastada","S":[{"n":"Limpiar contactos con alcohol isopropílico","t":"Los botones de goma usan una almohadilla de carbono que puentea dos pistas al presionar; la suciedad aumenta la resistencia de contacto.","s":"Limpia la goma y las pistas de la placa: la mugre impide que la energía pase al presionar.","d":"pad"},{"n":"Restaurar la almohadilla","t":"Reponer la capa conductora con un parche de pintura conductiva o reemplazar la goma; verificar con el multímetro que la resistencia al presionar sea baja.","s":"Si el circulito negro de la goma está gastado, cubre con pintura conductiva o cámbiala.","d":"pad"}],"mine":"Limpiaría la goma y las pistas con alcohol; si sigue fallando, restauro la almohadilla o cambio la goma.","steps":["Abrir el control","Limpiar goma y pistas","Medir al presionar","Pintura conductiva","Cambiar la goma"]},"rMotor":{"r":"Motor con carbones gastados o devanado quemado","S":[{"n":"Revisar y cambiar los carbones","t":"Los motores universales usan escobillas de carbón sobre el colector; si están gastadas hay chisporroteo, calentamiento y olor a quemado.","s":"Son como “lápices” de carbón que tocan el motor; cuando se acaban, deja de recibir energía.","d":"motor"},{"n":"Medir y reemplazar el motor","t":"Con el aparato desconectado, medir la resistencia de los devanados: OL (abierto) o un valor cercano a 0 Ω (corto) indica bobinado dañado y requiere sustitución.","s":"Si por dentro el motor está quemado, lo más práctico es cambiarlo.","d":"motor"}],"mine":"Aislaría el motor y mediría sus devanados; con los carbones gastados lo más barato es cambiarlos.","steps":["Desconectar","Revisar los carbones","Medir devanados","Cambiar carbones","Cambiar el motor"]},"rEje":{"r":"Eje trabado o acople dañado","S":[{"n":"Liberar y limpiar el eje","t":"Desmontar cuchilla y acople; residuos o un rodamiento seco aumentan la carga y sobrecalientan el motor.","s":"Algo está atorado: quita la cuchilla y revisa que no haya residuos ni piezas rotas.","d":"motor"},{"n":"Reemplazar acople y rodamiento","t":"Sustituir el acople de goma o plástico desgastado y lubricar o cambiar el rodamiento antes de volver a energizar.","s":"Si la pieza de goma o el baleo están gastados, cámbialos para que gire sin esfuerzo.","d":"motor"}],"mine":"Giraría el eje a mano, desenchufado: si raspa son rodamientos; si gira libre, sospecho del capacitor o los carbones.","steps":["Girar el eje a mano","Quitar obstrucciones","Medir el capacitor","Revisar carbones","Cambiar lo dañado"]},"rFusible":{"r":"Fusible térmico abierto o cable interrumpido","S":[{"n":"Medir y reemplazar el fusible térmico","t":"Con el aparato desconectado, medir continuidad en el fusible térmico (OL si está abierto) y sustituirlo por uno de la misma temperatura y corriente. Nunca lo puentees.","s":"El fusible se corta si el aparato se calienta demasiado; si marca OL, hay que cambiarlo, nunca saltarlo con un cable.","d":"motor"},{"n":"Sustituir el cable o el interruptor","t":"Localizar la interrupción midiendo continuidad por tramos y reemplazar el cable o interruptor dañado.","s":"Si el cable o el botón están rotos por dentro, cámbialos.","d":"motor"}],"mine":"Antes de cambiarlo buscaría por qué se abrió (filtro tapado, motor trabado) para que no se repita.","steps":["Medir continuidad","Localizar el abierto","Buscar la causa","Cambiar por el mismo valor","Probar con cuidado"]},"rFuente":{"r":"Falla en la fuente de alimentación","S":[{"n":"Verificar y reemplazar pilas o fuente","t":"Medir Vcc en DC bajo carga: una caída por debajo de la tensión nominal indica pilas agotadas o una fuente sin capacidad de corriente suficiente.","s":"Si el medidor marca casi cero, la energía no llega: cambia las pilas o prueba otro cargador.","d":"led"},{"n":"Revisar polaridad y cables","t":"Comprobar que V+ y GND estén en los rieles correctos y que el conector no tenga la polaridad invertida.","s":"Asegúrate de que el cable rojo vaya al riel positivo y el negro al negativo.","d":"led"}],"mine":"Pondría una fuente buena conocida antes de tocar el circuito: descarta media falla en un minuto.","steps":["Medir en vacío","Medir con carga","Cambiar la fuente","Revisar polaridad","Probar de nuevo"]},"rContacto":{"r":"Mal contacto o riel interrumpido","S":[{"n":"Puentear el riel partido","t":"Muchas protoboards seccionan los rieles de alimentación a la mitad; une ambos tramos con un jumper para restablecer la continuidad.","s":"El carril de energía está cortado a egro y rojo vale…","1 kΩ","100 Ω|10 kΩ|1 MΩ","Marrón 1, negro 0, rojo ×100: 10 × 100 = 1000 Ω."],["¿Qué componente deja pasar CA pero bloquea CC?","Capacitor","Diodo|Resistencia|Fusible","El capacitor bloquea la continua y deja pasar la alterna."],["Caso real: a tus audífonos les falla un lado. ¿Causa más probable?","Cable roto o jack sucio","Batería del celular|Volumen del televisor|Pantalla dañada","Un conductor roto o un jack sucio deja un canal mudo."],["¿Qué potencia hay con 12 V y 2 A?","24 W","6 W|14 W|0.17 W","P = V × I = 12 × 2 = 24 W."],["¿Qué hace un capacitor de 100 nF junto a un circuito integrado?","Filtra el ruido de la alimentación","Sube el voltaje|Reduce la corriente|Da luz","Entrega picos rápidos de corriente y filtra el ruido en Vcc.","filt"],["¿Qué hace un divisor de voltaje?","Obtiene una fracción del voltaje con dos resistencias","Duplica el voltaje|Almacena carga|Convierte CA en CC","Vout = Vin × R2 / (R1 + R2).","divider"],["Caso real: el LED parpadea al mover un cable de tu protoboard. Es…","Un falso contacto","Exceso de voltaje|Un LED de otro color|Un capacitor sin carga","Si falla al mover el cable, ese contacto es el culpable."],["¿Qué componente genera parpadeos con solo resistencias y un capacitor?","Temporizador 555","Fusible|Diodo Zener|Regulador 7805","El 555 astable fija su frecuencia con R y C."],["¿Qué mide la prueba de continuidad del multímetro?","Si hay un camino eléctrico sin interrupciones","El voltaje de una pila|La temperatura|La velocidad del motor","Suena cuando hay conexión entre los dos puntos."],["En un divisor de voltaje con R1 = R2 y Vin = 10 V, ¿cuánto vale Vout?","5 V","2.5 V|10 V|20 V","Vout = Vin·R2/(R1+R2) = 10·½ = 5 V.","divider"],["Fuente de 5 V, LED rojo (≈2 V) y 10 mA deseados. ¿Qué resistor usas?","300 Ω","100 Ω|1 kΩ|3 kΩ","R = (5 − 2) V / 0.01 A = 300 Ω; se usa el valor comercial cercano, 330 Ω.","led"]]],"a":["Avanzado",[["Un 7805 con 12 V de entrada y 1 A de carga, ¿cuánta potencia disipa?","7 W","12 W|5 W|1 W","P = (Vin − Vout)·I = (12 − 5)·1 = 7 W."],["¿Frecuencia de corte de un filtro RC de 1 kΩ y 100 nF?","≈ 1.6 kHz","≈ 160 Hz|≈ 16 kHz|≈ 100 Hz","fc = 1/(2πRC) ≈ 1.59 kHz."],["Caso real: el microcontrolador se reinicia al arrancar un motor. ¿Qué ayuda más?","Capacitor de desacople, diodo flyback y tierra común","Una resistencia más grande|Cambiar el color del cable|Bajar el voltaje","El motor genera picos y caídas de tensión que hay que filtrar."],["¿Qué ventaja tiene un regulador buck sobre uno lineal?","Más eficiencia y menos calor","Siempre es más barato|No usa capacitores|Hace más ruido","El buck conmuta y desperdicia mucho menos energía en calor."],["¿Para qué sirve una resistencia pull-up?","Fijar nivel alto cuando la entrada está flotante","Elevar el voltaje de la fuente|Limitar un LED|Filtrar CA","Evita lecturas aleatorias manteniendo la entrada en alto."],["Un amplificador operacional no inversor con R1 = 1 kΩ y R2 = 9 kΩ tiene ganancia…","10","9|1|0.1","Ganancia = 1 + R2/R1 = 1 + 9 = 10."],["Caso real: un LM35 da lecturas que saltan. ¿Qué mejora más?","Filtro RC y promediar lecturas","Cambiarlo por un LED|Alargar el cable|Quitar el capacitor","El filtro y el promedio reducen el ruido de la medición."],["¿Qué le pasa a la resistencia de una LDR al aumentar la luz?","Disminuye","Aumenta|Se mantiene|Se vuelve infinita","Una fotorresistencia baja su valor con más luz."],["¿Cuánto vale la resistencia de un elemento de 1000 W a 127 V?","≈ 16 Ω","≈ 127 Ω|≈ 8 Ω|≈ 1000 Ω","R = V²/P = 127²/1000 ≈ 16.1 Ω."],["¿Qué provoca un lazo de tierra en un equipo de audio?","Zumbido de 60 Hz","Más volumen|Silencio total|Menos graves","Dos tierras a distinto potencial meten el zumbido de la red (60 Hz en México)."],["¿Cuántos bits de ADC distinguen unos 5 mV en un rango de 0–5 V?","10 bits","4 bits|6 bits|1 bit","Con 10 bits: 5 V / 1024 ≈ 4.9 mV por paso."],["Caso real: la batería de litio de un celular se ve hinchada. ¿Qué haces?","Dejar de usarla y cambiarla","Pincharla para sacar el gas|Cargarla más rápido|Congelarla","Una batería hinchada puede incendiarse: se reemplaza y se recicla."],["En un transistor NPN como interruptor, ¿qué limita la corriente de base?","Una resistencia en serie con la base","El colector|Un capacitor|El emisor a tierra","Esa resistencia protege la unión base-emisor."],["¿Qué frecuencia da un 555 astable con R1, R2 y C?","f ≈ 1.44 / ((R1 + 2·R2)·C)","f = R1·R2·C|f = 1/(R1·C)|f = 2π·R·C","Es la fórmula del astable: con 1 kΩ, 47 kΩ y 10 µF da ≈ 1.5 Hz."],["Un transistor NPN en saturación se comporta aproximadamente como…","Interruptor cerrado entre colector y emisor","Interruptor abierto|Fuente de corriente ideal|Diodo en inversa","En saturación VCE es muy pequeño (≈0.2 V), así que actúa como interruptor cerrado."],["Un amplificador operacional inversor con Rf = 10 kΩ y Rin = 1 kΩ tiene una ganancia de…","−10","+10|−0.1|+0.1","Ganancia = −Rf/Rin = −10."]]]};
const RETOS=[{"l":"Fácil","q":"El LED de mi lámpara con pila de 9 V se quema al conectarlo.","a":"Un LED rojo (Vf ≈ 2 V, 15 mA) sin limitador recibe corriente excesiva. R = (9 − 2) / 0.015 ≈ 467 Ω → 470 Ω de 1/4 W. Potencia: 7 V × 15 mA ≈ 0.1 W.","b":"El LED es una manguera delgada: si dejas pasar toda la corriente de la pila, revienta. La resistencia es una llave que deja pasar solo lo justo.","d":{"v":"9 V","r":"470 Ω"}},{"l":"Fácil","q":"Mi control remoto dejó de funcionar.","a":"Mide cada pila (1.5 V) y busca sulfato en los contactos. Con la cámara del celular, que sí ve el infrarrojo, comprueba si el LED emisor parpadea al pulsar: si parpadea, falla el receptor del aparato; si no, el control.","b":"El control es una linterna invisible. Si la cámara no ve luz, falta energía o contacto; si la ve, el problema está en el televisor.","d":["Cambiar las pilas","Limpiar los contactos","Prueba con la cámara","Revisar el receptor del TV"]},{"l":"Medio","q":"Quiero una luz que se encienda sola cuando oscurece.","a":"Divisor con R 10 kΩ (a +5 V) y LDR (a GND). A oscuras el LDR supera 100 kΩ, el nodo sube a ~4.5 V y satura un 2N2222; con luz (~1 kΩ) el nodo cae a ~0.45 V y el transistor corta. LED con R 330 Ω en el colector.","b":"El sensor de luz cambia su “dureza”: con luz deja escapar la señal y a oscuras no. El transistor es un interruptor que vigila esa señal y prende el LED.","d":["Pila 5 V","R 10k + LDR (divisor)","Transistor 2N2222","LED + R 330 Ω"]},{"l":"Medio","q":"Mi licuadora huele a quemado y pierde fuerza.","a":"Causas típicas: carbones gastados (menos de 5 mm), rodamiento seco o sobrecarga térmica. Mide la resistencia de las bobinas, cambia los carbones, lubrica el rodamiento y limita el uso continuo con hielo a 1–2 min.","b":"El motor es un corredor cansado: sucio o exigido en exceso se sobrecalienta. Limpiarlo y cambiar lo gastado le devuelve la fuerza.","d":["Desconectar","Revisar carbones","Lubricar rodamientos","Probar sin carga","Usar tandas cortas"]}, const mkQ=(q,c,ws,u,e)=>{const f=v=>fmt(v,u),cs=f(c),s=[];[...ws,c*1.5,c*3,c/3,c*7].forEach(w=>{const x=f(w);if(x!==cs&&!s.includes(x)&&s.length<3)s.push(x)});return[q,cs,s.join('|'),e,null,1]};
const GEN={f:[()=>{const V=pick([3,5,9,12]),R=pick([100,220,330,470,1000]);return mkQ(`Una resistencia de ${fmt(R,'Ω')} está conectada a ${V} V. ¿Qué corriente circula?`,V/R,[V*R/1000,R/V/1000,V/R*10],'A',`I = V/R = ${V}/${R} = ${fmt(V/R,'A')}.`)},
 ()=>{const a=pick([100,220,330,470,1000]),b=pick([220,470,680,1000,2200]);return mkQ(`Dos resistencias en serie de ${fmt(a,'Ω')} y ${fmt(b,'Ω')}. ¿Cuánto vale el total?`,a+b,[Math.abs(b-a),a*b/(a+b),(a+b)/2],'Ω',`En serie se suman: ${fmt(a,'Ω')} + ${fmt(b,'Ω')} = ${fmt(a+b,'Ω')}.`)}],
i:[()=>{const a=pick([100,220,330,470,1000]),b=pick([220,470,680,1000,2200]),p=a*b/(a+b);return mkQ(`Dos resistencias en paralelo de ${fmt(a,'Ω')} y ${fmt(b,'Ω')}. ¿Cuánto vale la equivalente?`,p,[a+b,(a+b)/2,Math.min(a,b)*2],'Ω',`R = R1·R2/(R1+R2) = ${fmt(p,'Ω')}; siempre es menor que la menor de las dos.`)},
 ()=>{const s=pick([5,9,12]),vf=pick([2,3]),ma=pick([10,15,20]),r=(s-vf)/(ma/1e3);return mkQ(`Fuente de ${s} V, LED con Vf = ${vf} V y ${ma} mA deseados. ¿Qué resistor necesitas (valor calculado)?`,r,[s/(ma/1e3),vf/(ma/1e3),(s+vf)/(ma/1e3)],'Ω',`R = (${s} − ${vf}) V / ${ma} mA = ${fmt(r,'Ω')}; se usa el valor comercial más cercano hacia arriba.`)},
 ()=>{const V=pick([5,9,12]),I=pick([20,50,100,250]);return mkQ(`Un circuito de ${V} V consume ${I} mA. ¿Qué potencia usa?`,V*I/1e3,[V/(I/1e3),I/V/1e3,V*I],'W',`P = V·I = ${V} V × ${I} mA = ${fmt(V*I/1e3,'W')}.`)}],
a:[()=>{const vi=pick([5,9,12]),r1=pick([1000,2200,4700,10000]),r2=pick([1000,2200,4700,10000]),o=vi*r2/(r1+r2);return mkQ(`Divisor con Vin = ${vi} V, R1 = ${fmt(r1,'Ω')} y R2 = ${fmt(r2,'Ω')} (Vout sobre R2). ¿Cuánto vale Vout?`,o,[vi*r1/(r1+r2),vi/2,vi-o],'V',`Vout = Vin·R2/(R1+R2) = ${fmt(o,'V')}.`)},
 ()=>{const r=pick([1000,4700,10000,47000]),c=pick([1,10,47,100]),x=r*c/1e6;return mkQ(`Un circuito RC tiene R = ${fmt(r,'Ω')} y C = ${c} µF. ¿Cuánto vale la constante de tiempo τ?`,x,[x*2*Math.PI,x/2,x*5],'s',`τ = R·C = ${fmt(r,'Ω')} × ${c} µF = ${fmt(x,'s')}; la carga llega a ~99 % en 5τ.`)},
 ()=>{const r1=pick([1000,2200]),r2=pick([10000,22000,47000]),c=pick([1,10,100]),f=1.44/((r1+2*r2)*c/1e6);return mkQ(`555 astable con R1 = ${fmt(r1,'Ω')}, R2 = ${fmt(r2,'Ω')} y C = ${c} µF. ¿Qué frecuencia genera?`,f,[1/((r1+r2)*c/1e6),1.44/(r2*c/1e6)*2,f*2],'Hz',`f ≈ 1.44/((R1 + 2·R2)·C) = ${fmt(f,'Hz')}.`)}]};

function miniQ(host,qs,done){let i=0,ok=0,h=0;
 const draw=()=>{const[q,c,m]=qs[i];h=0;host.innerHTML=`<h3>${q}</h3><div class="opts">${mez([c,...m.split('|')]).map((x,j)=>`<button data-c="${x==c?1:0}" style="--i:${j}">${x}</button>`).join('')}</div><div id="mf"></div>`};
 host.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='mn'){i++;return i<qs.length?draw():done(ok,qs.length)}

 draw()}
